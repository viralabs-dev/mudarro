version: 1
name: Poetry runtime
services:
    - id: app-python
      dir: .
      language: python
      manager: poetry
      infrastructure:
        kind: local
      commands:
      start:
        args: [poetry, run, python, app.py]
        group: aplicacao
      test:
        args: [poetry, run, python, probe.py]
        group: qualidade
        install:
            args:
                - poetry
                - install
            group: dependencias
      pending:
        - Declare commands.start; módulo Python não é inferido
