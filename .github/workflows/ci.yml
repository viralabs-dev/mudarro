name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l cmd internal)"
      - run: bash -n install.sh scripts/*.sh
      - run: go build -o bin/mudarro ./cmd/mudarro
      - run: bash scripts/smoke.sh "$PWD/bin/mudarro"
      - run: bash scripts/test-installer.sh
      - run: pwsh -NoProfile -File scripts/test-installer.ps1
      - name: Package release archives (incl. Windows zip)
        if: runner.os == 'Linux'
        run: bash scripts/release.sh v0.0.0-ci && cat dist/checksums.txt && unzip -l dist/mudarro_windows_amd64.zip
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      # Keep LF checkouts so golden files and gofmt behave like on Unix.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o bin/mudarro.exe ./cmd/mudarro
      - run: ./bin/mudarro.exe version
      # Installer: PowerShell 7 and Windows PowerShell 5.1, real HKCU PATH and NTFS junctions.
      - run: ./scripts/test-installer.ps1
      - run: ./scripts/test-installer.ps1 -InstallerShell powershell
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o bin/mudarro ./cmd/mudarro
      - run: sudo apt-get update && sudo apt-get install -y podman podman-compose
      - run: bash scripts/integration-containers.sh "$PWD/bin/mudarro" docker
      - run: bash scripts/integration-offline.sh "$PWD/bin/mudarro"
      - run: bash scripts/integration-containers.sh "$PWD/bin/mudarro" podman
      - uses: helm/kind-action@v1
        with:
          cluster_name: mudarro-ci
      - run: bash scripts/integration-k8s.sh "$PWD/bin/mudarro" kind-mudarro-ci
  databases:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: mudarro_test_only
          POSTGRES_DB: mudarro_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: go build -o bin/mudarro ./cmd/mudarro
      - run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
      - run: bash scripts/integration-databases.sh "$PWD/bin/mudarro"
        env:
          TEST_POSTGRES_URL: postgresql://postgres:mudarro_test_only@localhost:5432/mudarro_test
